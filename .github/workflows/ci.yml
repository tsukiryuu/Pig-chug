name: Deploy to Glitch

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Deploy to Glitch
      env:
        GLITCH_GIT_URL: ${{ secrets.GLITCH_GIT_URL }}
        GLITCH_API_TOKEN: ${{ secrets.GLITCH_API_TOKEN }}
        GLITCH_PROJECT: bony-nasal-postage
      run: |
        set -euo pipefail
        if [ -z "$GLITCH_GIT_URL" ] || [ -z "$GLITCH_API_TOKEN" ]; then
          echo "::error::Rotated deployment secrets are not configured; deployment safely disabled."
          exit 1
        fi
        curl -X POST "https://api.glitch.com/projects/${{ env.GLITCH_PROJECT }}/git/import" \
          -d '{"url": "${{ env.GLITCH_GIT_URL }}"}' \
          -H "Authorization: Bearer ${{ env.GLITCH_API_TOKEN }}"
